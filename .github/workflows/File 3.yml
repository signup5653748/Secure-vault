name: Publish Failure Log

on:
  # Automatically runs when the build workflow fails
  workflow_run:
    workflows: ["Build Release APK"]
    types:
      - completed
      
  # Allows you to run it manually for any past failed build
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the failed build (e.g., 1234567890). Found in the URL of the failed run. Leave empty to auto-detect the latest failure.'
        required: false
        type: string

jobs:
  publish-log:
    # Run if triggered by a failed workflow_run, OR if manually triggered
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Fetch & Simplify Failed Step Logs
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Use the manually provided run_id, or fall back to the workflow_run trigger's ID
        TARGET_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        cat << 'EOF' > fetch_failure_logs.py
        import os, json, urllib.request, urllib.error, re, base64, sys

        repo = os.environ.get("GITHUB_REPOSITORY", "")
        token = os.environ.get("GITHUB_TOKEN", "")
        target_run_id = os.environ.get("TARGET_RUN_ID", "").strip()
        default_branch = os.environ.get("DEFAULT_BRANCH") or "main"
        log_branch = "ci-logs"
        log_path = "latest-failure.txt"

        if not repo or not token:
            print("::error:: Missing required environment variables")
            sys.exit(1)

        base = "https://api.github.com/repos/" + repo
        headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json"}

        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                return None

        no_redirect_opener = urllib.request.build_opener(NoRedirect)

        def api_get(url):
            req = urllib.request.Request(url, headers=headers)
            try:
                with no_redirect_opener.open(req) as r:
                    return