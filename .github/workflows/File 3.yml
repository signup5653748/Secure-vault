import os
import json
import urllib.request
import urllib.error
import re

def get_github_token():
    # Try to read from git credentials first
    cred_file = os.path.expanduser("~/.git-credentials")
    if os.path.exists(cred_file):
        with open(cred_file, "r") as f:
            content = f.read()
            # Format: https://<token>@github.com/
            match = re.search(r"https://([^@]+)@github\.com/", content)
            if match:
                return match.group(1)
    
    # Fallback to environment variable if git credentials aren't found
    return os.environ.get("GITHUB_TOKEN")

def api_get(url, headers=None):
    req = urllib.request.Request(url, headers=headers or {})
    try:
        with urllib.request.urlopen(req) as r:
            return r.read()
    except urllib.error.HTTPError as e:
        if e.code in (301, 302, 303, 307, 308):
            location = e.headers.get("Location")
            if location:
                # CRITICAL: Do NOT forward Authorization header to the redirect URL.
                # GitHub's signed blob URLs will reject requests with an Auth header.
                with urllib.request.urlopen(location) as r2:
                    return r2.read()
        raise

def api_json(url, headers=None):
    req = urllib.request.Request(url, headers=headers or {})
    with urllib.request.urlopen(req) as r:
        return json.load(r)

def main():
    token = get_github_token()
    if not token:
        print("Error: Could not find GitHub token in ~/.git-credentials or $GITHUB_TOKEN")
        print("Please ensure you are logged in via 'gh auth login' or set the GITHUB_TOKEN env var.")
        return

    headers = {
        "Authorization": f"token {token}",
        "Accept": "application/vnd.github.v3+json",
        "User-Agent": "Python-Log-Fetcher"
    }

    owner = "signup5653748"
    repo = "Secure-vault"

    # 1. Get latest workflow run
    runs_url = f"https://api.github.com/repos/{owner}/{repo}/actions/runs?per_page=1"
    runs_data = api_json(runs_url, headers)
    
    if not runs_data.get("workflow_runs"):
        print("No workflow runs found.")
        return

    latest_run = runs_data["workflow_runs"][0]
    run_id = latest_run["id"]
    print(f"Latest run ID: {run_id} (Conclusion: {latest_run.get('conclusion')})")

    # 2. Get jobs for this run
    jobs_url = f"https://api.github.com/repos/{owner}/{repo}/actions/runs/{run_id}/jobs"
    jobs_data = api_json(jobs_url, headers)

    found_errors = False
    for job in jobs_data.get("jobs", []):
        if job.get("conclusion") == "failure":
            print(f"\n--- Fetching log for failed job: {job['name']} ---")
            job_id = job["id"]
            log_url = f"https://api.github.com/repos/{owner}/{repo}/actions/jobs/{job_id}/logs"
            
            try:
                log_bytes = api_get(log_url, headers)
                log_text = log_bytes.decode("utf-8", errors="replace")
                
                # 3. Filter lines for actual signal
                keywords = ["e: file://", "FAILURE", "Unresolved reference", "error:", "BUILD FAILED"]
                for line in log_text.split("\n"):
                    if any(kw in line for kw in keywords):
                        # Strip ANSI color codes for clean terminal output
                        clean_line = re.sub(r'\x1b\[[0-9;]*m', '', line).strip()
                        if clean_line:
                            print(clean_line)
                            found_errors = True
                
                if not found_errors:
                    print("No specific error keywords found in this job's log.")
            except Exception as e:
                print(f"Error fetching log for job {job_id}: {e}")

if __name__ == "__main__":
    main()