name: Publish Failure Log

on:
  # Automatically runs when the build workflow fails
  workflow_run:
    workflows: ["Build Release APK"]
    types:
      - completed
      
  # Allows you to run it manually for any past failed build
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the failed build (e.g., 1234567890). Found in the URL of the failed run. Leave empty to auto-detect the latest failure.'
        required: false
        type: string

jobs:
  publish-log:
    # Run if triggered by a failed workflow_run, OR if manually triggered
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Fetch & Simplify Failed Step Logs
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Use the manually provided run_id, or fall back to the workflow_run trigger's ID
        TARGET_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        cat << 'EOF' > fetch_failure_logs.py
        import os, json, urllib.request, urllib.error, re, base64, sys

        repo = os.environ.get("GITHUB_REPOSITORY", "")
        token = os.environ.get("GITHUB_TOKEN", "")
        target_run_id = os.environ.get("TARGET_RUN_ID", "").strip()
        default_branch = os.environ.get("DEFAULT_BRANCH") or "main"
        log_branch = "ci-logs"
        log_path = "latest-failure.txt"

        if not repo or not token:
            print("::error:: Missing required environment variables")
            sys.exit(1)

        base = "https://api.github.com/repos/" + repo
        headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json"}

        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                return None

        no_redirect_opener = urllib.request.build_opener(NoRedirect)

        def api_get(url):
            req = urllib.request.Request(url, headers=headers)
            try:
                with no_redirect_opener.open(req) as r:
                    return r.read()
            except urllib.error.HTTPError as e:
                if e.code in (301, 302, 303, 307, 308):
                    location = e.headers.get("Location")
                    if location:
                        with urllib.request.urlopen(location) as r2:
                            return r2.read()
                raise

        def api_json(url, data=None, method=None):
            body = json.dumps(data).encode() if data is not None else None
            req = urllib.request.Request(url, data=body, headers=headers, method=method)
            if body:
                req.add_header("Content-Type", "application/json")
            try:
                with urllib.request.urlopen(req) as r:
                    return json.load(r)
            except urllib.error.HTTPError as e:
                print(f"::error:: API request failed to {url}: {e.code} {e.reason}", file=sys.stderr)
                raise

        try:
            # If no run_id was provided manually, auto-detect the latest failed "Build Release APK" run
            if not target_run_id:
                print("::notice:: No Run ID provided. Searching for the latest failed 'Build Release APK' run...")
                runs_data = api_json(base + "/actions/runs?per_page=30")
                found_run = None
                for run in runs_data.get("workflow_runs", []):
                    if run.get("name") == "Build Release APK" and run.get("conclusion") == "failure":
                        found_run = run
                        break
                
                if found_run:
                    target_run_id = str(found_run["id"])
                    print(f"::notice:: Auto-detected latest failed run ID: {target_run_id}")
                else:
                    print("::error:: No failed 'Build Release APK' run found recently. Please provide a Run ID manually.")
                    sys.exit(1)

            print(f"::notice:: Fetching logs for Run ID: {target_run_id}")
            jobs_data = api_json(base + "/actions/runs/" + target_run_id + "/jobs")
            failed_jobs = [j for j in jobs_data.get("jobs", []) if j.get("conclusion") == "failure"]
            
            if not failed_jobs:
                failed_jobs = [j for j in jobs_data.get("jobs", []) if j.get("conclusion") not in ("success", "skipped")]

            combined = []
            if not failed_jobs:
                combined.append("::warning:: No failed jobs found for this run. Workflow may have been cancelled.\n")
            else:
                for job in failed_jobs:
                    combined.append(f"===== FAILED JOB: {job.get('name', 'Unknown')} =====\n")
                    
                    try:
                        log_bytes = api_get(base + "/actions/jobs/" + str(job["id"]) + "/logs")
                        log_text = log_bytes.decode("utf-8", errors="replace")
                        
                        parts = re.split(r'(?m)^##\[group\]', log_text)
                        failed_steps_output = []
                        skip_markers = ["##[error]", "FAILED", "Exception", "FAILURE:", "Caused by:", "Execution failed for task", "error:", "Build failed"]
                        
                        for part in parts:
                            if not part.strip():
                                continue
                            
                            lines = part.split('\n', 1)
                            step_name = lines[0].strip()
                            step_log = lines[1] if len(lines) > 1 else ""
                            
                            if not any(marker in step_log for marker in skip_markers):
                                continue
                            
                            step_lines = step_log.split('\n')
                            error_indices = []
                            
                            for i, line in enumerate(step_lines):
                                clean_line = re.sub(r'\x1b\[[0-9;]*m', '', line)
                                
                                is_critical = (
                                    "##[error]" in clean_line or
                                    "FAILURE:" in clean_line or
                                    "Execution failed for task" in clean_line or
                                    "Caused by:" in clean_line or
                                    "Exception" in clean_line or
                                    "error:" in clean_line.lower() or
                                    ("FAILED" in clean_line and ">" in clean_line) or
                                    "* What went wrong:" in clean_line or
                                    "* Try:" in clean_line or
                                    "Build failed" in clean_line
                                )
                                
                                if is_critical:
                                    error_indices.append(i)
                
                            if error_indices:
                                context_lines = []
                                for i in error_indices:
                                    start = max(0, i - 3)
                                    end = min(len(step_lines), i + 4)
                                    context_lines.extend(step_lines[start:end])
                                
                                seen = set()
                                cleaned_lines = []
                                for line in context_lines:
                                    clean = re.sub(r'\x1b\[[0-9;]*m', '', line).strip()
                                    if clean and clean not in seen:
                                        seen.add(clean)
                                        cleaned_lines.append(line)
                                
                                failed_steps_output.append(f"\n--- FAILED STEP: {step_name} ---\n" + "\n".join(cleaned_lines) + "\n")
                            else:
                                failed_steps_output.append(f"\n--- FAILED STEP: {step_name} (Last 50 lines) ---\n" + "\n".join(step_lines[-50:]) + "\n")
                    
                        if failed_steps_output:
                            combined.append("".join(failed_steps_output))
                        else:
                            combined.append("\n--- NO SPECIFIC ERROR MARKER FOUND, SHOWING LAST 100 LINES OF JOB ---\n")
                            combined.append("\n".join(log_text.splitlines()[-100:]))
                            
                    except Exception as e:
                        combined.append(f"[Could not fetch log for job {job.get('name')}: {str(e)}]\n")
                    
                    combined.append("\n" + "="*60 + "\n\n")

            full_log = "".join(combined)

            # --- GitHub API Branch/File Logic ---
            branch_exists = True
            try:
                api_json(base + "/git/refs/heads/" + log_branch)
            except urllib.error.HTTPError as e:
                if e.code == 404:
                    branch_exists = False
                else:
                    raise

            if not branch_exists:
                main_ref = api_json(base + "/git/refs/heads/" + default_branch)
                sha = main_ref["object"]["sha"]
                api_json(base + "/git/refs", data={"ref": "refs/heads/" + log_branch, "sha": sha}, method="POST")

            existing_sha = None
            try:
                existing = api_json(base + "/contents/" + log_path + "?ref=" + log_branch)
                existing_sha = existing.get("sha")
            except urllib.error.HTTPError as e:
                if e.code != 404:
                    raise

            b64content = base64.b64encode(full_log.encode("utf-8")).decode()
            payload = {
                "message": "Update latest CI failure log (run " + target_run_id + ")", 
                "content": b64content, 
                "branch": log_branch
            }
            if existing_sha:
                payload["sha"] = existing_sha

            result = api_json(base + "/contents/" + log_path, data=payload, method="PUT")
            print("::notice:: Published simplified failure log: " + result["content"]["html_url"])
            print("::notice:: Raw URL: https://raw.githubusercontent.com/" + repo + "/" + log_branch + "/" + log_path)

        except Exception as e:
            print(f"::error:: Fatal script error: {str(e)}", file=sys.stderr)
            import traceback
            traceback.print_exc()
            sys.exit(1)
        EOF
        
        python3 fetch_failure_logs.py