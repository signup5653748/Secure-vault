name: Publish Failure Log

on:
  workflow_run:
    workflows: ["Build Release APK"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the failed build (leave empty to auto-detect latest)'
        required: false
        type: string

jobs:
  publish-log:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Fetch & Simplify Failed Step Logs
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TARGET_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        cat << 'PYEOF' > fetch_failure_logs.py
import os, json, urllib.request, urllib.error, re, base64, sys

repo = os.environ.get("GITHUB_REPOSITORY", "")
token = os.environ.get("GITHUB_TOKEN", "")
target_run_id = os.environ.get("TARGET_RUN_ID", "").strip()
default_branch = os.environ.get("DEFAULT_BRANCH") or "main"
log_branch = "ci-logs"
log_path = "latest-failure.txt"

if not repo or not token:
    print("::error:: Missing required environment variables")
    sys.exit(1)

base = "https://api.github.com/repos/" + repo
headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json"}

class NoRedirect(urllib.request.HTTPRedirectHandler):
    def redirect_request(self, req, fp, code, msg, hdrs, newurl): return None

no_redirect_opener = urllib.request.build_opener(NoRedirect)

def api_get(url):
    req = urllib.request.Request(url, headers=headers)
    try:
        with no_redirect_opener.open(req) as r: return r.read()
    except urllib.error.HTTPError as e:
        if e.code in (301, 302, 303, 307, 308):
            loc = e.headers.get("Location")
            if loc:
                with urllib.request.urlopen(loc) as r2: return r2.read()
        raise

def api_json(url, data=None, method=None):
    body = json.dumps(data).encode() if data is not None else None
    req = urllib.request.Request(url, data=body, headers=headers, method=method)
    if body: req.add_header("Content-Type", "application/json")
    try:
        with urllib.request.urlopen(req) as r: return json.load(r)
    except urllib.error.HTTPError as e:
        print(f"::error:: API request failed: {e.code} {e.reason}", file=sys.stderr)
        raise

try:
    if not target_run_id:
        print("::notice:: No Run ID provided. Searching for latest failed 'Build Release APK' run...")
        runs_data = api_json(base + "/actions/runs?per_page=30")
        found = next((r for r in runs_data.get("workflow_runs", []) if r.get("name") == "Build Release APK" and r.get("conclusion") == "failure"), None)
        if found:
            target_run_id = str(found["id"])
            print(f"::notice:: Auto-detected latest failed run ID: {target_run_id}")
        else:
            print("::error:: No failed 'Build Release APK' run found recently.")
            sys.exit(1)

    print(f"::notice:: Fetching logs for Run ID: {target_run_id}")
    jobs_data = api_json(base + "/actions/runs/" + target_run_id + "/jobs")
    failed_jobs = [j for j in jobs_data.get("jobs", []) if j.get("conclusion") == "failure"]
    if not failed_jobs:
        failed_jobs = [j for j in jobs_data.get("jobs", []) if j.get("conclusion") not in ("success", "skipped")]

    combined = []
    for job in failed_jobs:
        combined.append(f"===== FAILED JOB: {job.get('name', 'Unknown')} =====\n")
        try:
            log_bytes = api_get(base + "/actions/jobs/" + str(job["id"]) + "/logs")
            log_text = log_bytes.decode("utf-8", errors="replace")
            parts = re.split(r'(?m)^##\[group\]', log_text)
            failed_steps_output = []
            markers = ["##[error]", "FAILED", "Exception", "FAILURE:", "Caused by:", "Execution failed for task", "error:", "Build failed"]
            
            for part in parts:
                if not part.strip(): continue
                lines = part.split('\n', 1)
                step_name = lines[0].strip()
                step_log = lines[1] if len(lines) > 1 else ""
                if not any(m in step_log for m in markers): continue
                
                step_lines = step_log.split('\n')
                error_indices = [i for i, line in enumerate(step_lines) if any(x in re.sub(r'\x1b\[[0-9;]*m', '', line) for x in ["##[error]", "FAILURE:", "Execution failed for task", "Caused by:", "Exception", "error:", "FAILED", "* What went wrong:", "* Try:", "Build failed"])]
                
                if error_indices:
                    context = []
                    for i in error_indices: context.extend(step_lines[max(0, i-3):min(len(step_lines), i+4)])
                    cleaned, seen = [], set()
                    for line in context:
                        clean = re.sub(r'\x1b\[[0-9;]*m', '', line).strip()
                        if clean and clean not in seen:
                            seen.add(clean)
                            cleaned.append(line)
                    failed_steps_output.append(f"\n--- FAILED STEP: {step_name} ---\n" + "\n".join(cleaned) + "\n")
                else:
                    failed_steps_output.append(f"\n--- FAILED STEP: {step_name} (Last 50 lines) ---\n" + "\n".join(step_lines[-50:]) + "\n")
            
            combined.append("".join(failed_steps_output) if failed_steps_output else "\n--- NO ERROR MARKER FOUND, LAST 100 LINES ---\n" + "\n".join(log_text.splitlines()[-100:]))
        except Exception as e:
            combined.append(f"[Could not fetch log for job {job.get('name')}: {str(e)}]\n")
        combined.append("\n" + "="*60 + "\n\n")

    full_log = "".join(combined)
    branch_exists = True
    try: api_json(base + "/git/refs/heads/" + log_branch)
    except urllib.error.HTTPError as e:
        if e.code == 404: branch_exists = False
        else: raise

    if not branch_exists:
        main_ref = api_json(base + "/git/refs/heads/" + default_branch)
        api_json(base + "/git/refs", data={"ref": "refs/heads/" + log_branch, "sha": main_ref["object"]["sha"]}, method="POST")

    existing_sha = None
    try:
        existing = api_json(base + "/contents/" + log_path + "?ref=" + log_branch)
        existing_sha = existing.get("sha")
    except urllib.error.HTTPError as e:
        if e.code != 404: raise

    payload = {"message": f"Update CI failure log (run {target_run_id})", "content": base64.b64encode(full_log.encode("utf-8")).decode(), "branch": log_branch}
    if existing_sha: payload["sha"] = existing_sha

    result = api_json(base + "/contents/" + log_path, data=payload, method="PUT")
    print(f"::notice:: Published simplified failure log: {result['content']['html_url']}")

except Exception as e:
    print(f"::error:: Fatal script error: {str(e)}", file=sys.stderr)
    import traceback
    traceback.print_exc()
    sys.exit(1)
PYEOF
        python3 fetch_failure_logs.py